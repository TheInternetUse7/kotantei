services:
  kotantei:
    # Use latest, a published vMAJOR.MINOR.PATCH tag, or an immutable @sha256 digest.
    image: ghcr.io/theinternetuse7/kotantei:latest
    # Allowed: "no", always, on-failure[:N], or unless-stopped.
    restart: unless-stopped
    # Positive Docker duration, such as 30s or 1m.
    stop_grace_period: 30s
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Optional process limit: positive integer, or -1 for unlimited.
    pids_limit: 128
    # Optional resource limits: positive CPU count and Docker size (e.g. 512m or 1g).
    cpus: "1.0"
    mem_limit: "512m"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    volumes:
      # Writable, persistent Kotantei database; keep this volume across upgrades.
      - data:/data
      # Use a dedicated deployment folder containing compose.yaml, config.jsonc,
      # and optional legacy data.db. Fresh installs do not need data.db.
      # Config and legacy input are read-only; files must be readable by UID 65532.
      - type: bind
        source: .
        target: /setup
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
